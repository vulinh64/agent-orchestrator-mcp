spring.application.name: agent-orchestrator-mcp
server.port: ${SERVER_PORT:9999}
management.endpoints.web.exposure.include: health
spring.ai.mcp.server:
  protocol: ${MCP_PROTOCOL:STATELESS}
  name: agent-orchestrator-mcp
  version: 1.0.0
mcp.banner.format: ${MCP_BANNER_FORMAT:JSON}
mcp.eviction:
  enabled: ${MCP_EVICTION_ENABLED:true}
  question-timeout: ${MCP_EVICTION_QUESTION_TIMEOUT:10m}
  agent-idle-timeout: ${MCP_EVICTION_AGENT_IDLE_TIMEOUT:10m}
